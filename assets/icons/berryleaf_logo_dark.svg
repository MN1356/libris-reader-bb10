<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="pageGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="leafGrad_dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- 1. BOOK BODY (Flat top parallel to bottom) -->
  <g id="book" stroke-linecap="round" stroke-linejoin="round">
    <!-- Both Left & Right Pages have MATCHING background! -->
    <path d="M 512 370 L 160 290 L 160 770 L 512 850 Z"
          fill="url(#pageGrad_dark)" stroke="none" />
    <path d="M 512 370 L 864 290 L 864 770 L 512 850 Z"
          fill="url(#pageGrad_dark)" stroke="none" />

    <!-- Fanning Page Layers -->
    <path d="M 160 290 L 100 310 L 100 810 L 160 770 Z" fill="#0B111A" stroke="none" />
    <path d="M 864 290 L 924 310 L 924 810 L 864 770 Z" fill="#0B111A" stroke="none" />

    <!-- Bold Book Strokes -->
    <g fill="none" stroke="#F8FAFC">
      <!-- Left Page Outline -->
      <path d="M 512 370 L 160 290 L 160 770 L 512 850" stroke-width="22" />
      <!-- Right Page Outline -->
      <path d="M 512 370 L 864 290 L 864 770 L 512 850" stroke-width="22" />
      <!-- Center Crease / Spine -->
      <path d="M 512 370 L 512 850" stroke-width="20" />

      <!-- Fanning Page 1 (Left & Right) -->
      <path d="M 130 300 L 130 790 L 512 875 L 894 790 L 894 300" stroke-width="16" />
      <!-- Fanning Page 2 / Outer Cover (Bottom notch) -->
      <path d="M 100 310 L 100 810 L 460 895 L 512 935 L 564 895 L 924 810 L 924 310" stroke-width="20" />
    </g>

    <!-- Parallel Simulated Text Lines on Left Page -->
    <g stroke-linecap="round">
      <line x1="220" y1="353.6" x2="450" y2="405.9" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="220" y1="405.6" x2="450" y2="457.9" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="220" y1="457.6" x2="450" y2="509.9" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="220" y1="509.6" x2="450" y2="561.9" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="220" y1="561.6" x2="420" y2="607.1" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="220" y1="665.6" x2="360" y2="697.5" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
    </g>

    <!-- Parallel Simulated Text Lines on Right Page -->
    <g stroke-linecap="round">
      <line x1="574" y1="405.9" x2="804" y2="353.6" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="574" y1="457.9" x2="804" y2="405.6" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="574" y1="509.9" x2="804" y2="457.6" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="574" y1="561.9" x2="804" y2="509.6" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="574" y1="613.9" x2="804" y2="561.6" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="574" y1="665.9" x2="770" y2="621.4" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
      <line x1="574" y1="717.9" x2="680" y2="693.8" stroke="#64748B" stroke-width="11" stroke-linecap="round" opacity="0.45" />
    </g>
  </g>

  <!-- 2. SLENDER QUILL LEAF (Clean outline, NO outer halo band!) -->
  <g id="quill" stroke-linecap="round" stroke-linejoin="round">
    <!-- 2A. LEAF BLADE (Emerald Green Fill) -->
    <path d="M 465 570
             C 438 485 455 375 520 270
             C 570 190 630 115 715 100
             C 695 180 670 280 615 375
             C 565 460 520 540 465 570
             Z"
          fill="url(#leafGrad_dark)" stroke="none" />

    <!-- 2B. LEAF BLADE OUTLINE (Single clean stroke, no extra outer border!) -->
    <path d="M 465 570
             C 438 485 455 375 520 270
             C 570 190 630 115 715 100
             C 695 180 670 280 615 375
             C 565 460 520 540 465 570
             Z"
          fill="none" stroke="#F8FAFC" stroke-width="19" />

    <!-- 2C. QUILL NIB & STEM -->
    <path d="M 461 568
             C 468 605 474 645 477 672
             L 486 669
             C 483 640 478 603 472 566
             Z"
          fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2" />

    <!-- Pen Nib Point -->
    <path d="M 474 662 L 478 672 L 485 660 Z" fill="#F8FAFC" />

    <!-- 2D. REFINED BOTANICAL VEINS -->
    <!-- CENTRAL RACHIS (8px delicate botanical spine) -->
    <path d="M 478 672
             C 472 610 490 480 545 350
             C 590 245 648 160 715 100"
          fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" />

    <!-- LATERAL VEINS (5px delicate curves, 3 harmonious pairs) -->
    <!-- Pair 1 (Upper) -->
    <path d="M 610 225 C 585 220 560 235 545 250" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" />
    <path d="M 610 225 C 635 230 655 245 670 265" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" />

    <!-- Pair 2 (Middle) -->
    <path d="M 550 340 C 520 345 495 375 480 405" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" />
    <path d="M 550 340 C 580 345 605 370 622 400" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" />

    <!-- Pair 3 (Lower) -->
    <path d="M 505 465 C 485 478 472 505 466 525" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" />
    <path d="M 505 465 C 525 475 542 495 552 520" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" />

    <!-- 2E. ACTIVE WRITING INK STROKE -->
    <line x1="220" y1="613.6" x2="478" y2="672.3" stroke="#34D399" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
